name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore DK-Easy-Renamer.sln
      - name: Build
        run: dotnet build DK-Easy-Renamer.sln -c Release --no-restore
      - name: Test
        run: dotnet test DK-Easy-Renamer.sln -c Release --no-build --verbosity normal
