name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Generate app icon
        shell: pwsh
        run: ./tools/t03/Generate-Icon.ps1
      - name: Validate T04 fixture scripts without Explorer or live files
        shell: pwsh
        run: |
          foreach ($source in @(Get-ChildItem 'tools/t04' -Filter '*.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "Parse error in $($source.Name): $($errors[0])" }
          }
          $created = ./tools/t04/New-TestFixtures.ps1
          $prefix = [IO.Path]::GetFullPath([IO.Path]::GetTempPath()).TrimEnd('\') + '\'
          if (-not $created.Root.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase) -or
              -not ([IO.Path]::GetFileName($created.Root).StartsWith('DK-EasyRenamer-T04-'))) {
            throw 'Fixture generator did not return an isolated temp directory.'
          }
          try {
            if ($created.FileCount -ne 11) { throw 'Unexpected fixture file count.' }
            foreach ($file in @('file1.txt','file2.txt','file10.txt','한글 파일 03.txt','日本語 04.txt','_T04_MANIFEST.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $created.Root $file))) {
                throw "Fixture missing: $file"
              }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $created.Root '빈 폴더') -PathType Container)) {
              throw 'Empty-folder fixture missing.'
            }
          }
          finally {
            Remove-Item -LiteralPath $created.Root -Recurse -Force
          }
      - name: Restore
        run: dotnet restore DK-Easy-Renamer.sln
      - name: Build .NET app and Core
        run: dotnet build DK-Easy-Renamer.sln -c Release --no-restore
      - name: Test binary handoff
        run: dotnet test DK-Easy-Renamer.sln -c Release --no-build --verbosity normal
      - name: Build native x64 Explorer COM DLL
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found in installed Visual Studio.' }
          & $msbuild 'src/DK.EasyRenamer.Shell/DK.EasyRenamer.Shell.vcxproj' /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw 'Native shell build failed.' }
      - name: Publish app
        run: dotnet publish src/DK.EasyRenamer.App/DK.EasyRenamer.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/t01/app
      - name: Build unsigned identity MSIX
        shell: pwsh
        run: ./tools/t01/Build-SparsePackage.ps1
      - name: Upload developer probe (not a signed installer)
        uses: actions/upload-artifact@v4
        with:
          name: t01-unsigned-developer-probe
          path: artifacts/t01/
          retention-days: 7
      - name: Locate or install Inno Setup 6 compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6 compiler installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup ISCC.exe missing after installation.' }
      - name: Build T05 unsigned installer candidate (noninstallable)
        shell: pwsh
        run: ./tools/t05/Build-Distribution.ps1
      - name: Validate T05 identity, payload and SHA-256
        shell: pwsh
        run: ./tools/t05/Validate-Distribution.ps1
      - name: Upload unsigned T05 packaging candidate (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: t05-UNSIGNED-DO-NOT-INSTALL
          path: |
            artifacts/t05/installer/
            artifacts/t05/identity/
            artifacts/t05/DKEasyRenamer.Shell.msix
          retention-days: 7
      - name: Build isolated developer-signed setup (NOT a public release)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=DK Easy Renamer Development' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter ((Get-Date).AddMonths(3)) -KeyExportPolicy NonExportable
          try {
            ./tools/t05/Build-Distribution.ps1 -CertificateThumbprint $cert.Thumbprint
            ./tools/t05/Validate-Distribution.ps1 -ExpectedMode Signed
            # A fresh runner has no trusted machine-level test certificate;
            # the preflight must reject it before any installation.
            $preflightFailure = $null
            try {
              ./installer/windows/Preflight-Shell.ps1 -PackagePath 'artifacts/t05/DKEasyRenamer.Shell.msix'
            } catch { $preflightFailure = $_.ToString() }
            if (-not $preflightFailure -or -not $preflightFailure.Contains('LOCAL MACHINE TrustedPeople')) {
              throw 'Expected rejection of untrusted developer-signed MSIX before installation.'
            }
            Export-Certificate -Cert $cert -FilePath 'artifacts/t05/installer/DKEasyRenamer-TEST-ONLY.cer' -Force | Out-Null
          }
          finally {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
          }
      - name: Upload developer signed setup and public test certificate (TRUST MANUALLY)
        uses: actions/upload-artifact@v4
        with:
          name: t05-DEV-SIGNED-TEST-ONLY-MANUAL-TRUST
          path: |
            artifacts/t05/installer/
            artifacts/t05/DKEasyRenamer.Shell.msix
          retention-days: 7
